<?xml version="1.0" encoding="UTF-8"?>
<!-- GeoJokers Logo – Variant 9: Neon Glow on Black -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" width="400" height="520">
  <defs>
    <!-- Neon teal glow -->
    <filter id="v9glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Stronger glow for circle border -->
    <filter id="v9ringglow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="v9clip">
      <circle cx="200" cy="195" r="178"/>
    </clipPath>
    <radialGradient id="v9jgrad" cx="30%" cy="20%" r="80%">
      <stop offset="0%"   stop-color="#F97316"/>
      <stop offset="60%"  stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </radialGradient>
  </defs>

  <!-- Black background -->
  <rect width="400" height="520" fill="#000000"/>

  <!-- Dark circle base -->
  <circle cx="200" cy="195" r="178" fill="#050a0f"/>

  <!-- Glowing neon ring -->
  <circle cx="200" cy="195" r="178"
    fill="none" stroke="#2DD4BF" stroke-width="3"
    filter="url(#v9ringglow)"/>

  <!-- Jester – neon gradient with glow -->
  <g fill="url(#v9jgrad)" clip-path="url(#v9clip)" filter="url(#v9glow)">
    <!-- Juggling balls -->
    <rect x="164" y="34" width="14" height="14" rx="4"/>
    <rect x="183" y="22" width="16" height="16" rx="5"/>
    <rect x="204" y="30" width="14" height="14" rx="4"/>
    <rect x="152" y="27" width="13" height="13" rx="4"/>
    <rect x="218" y="25" width="13" height="13" rx="4"/>
    <!-- Hat bells -->
    <circle cx="158" cy="76" r="17"/>
    <circle cx="242" cy="76" r="17"/>
    <!-- Hat horns -->
    <path d="M175 108 Q169 95 161 83 Q154 73 158 68 Q165 64 169 80 Q172 95 177 106 Z"/>
    <path d="M225 108 Q231 95 239 83 Q246 73 242 68 Q235 64 231 80 Q228 95 223 106 Z"/>
    <!-- Head -->
    <circle cx="200" cy="124" r="29"/>
    <!-- Body -->
    <path d="M175 155 Q196 150 225 155 Q240 198 237 250 Q222 268 200 268 Q178 268 163 250 Q160 198 175 155 Z"/>
    <!-- Left arm & hand -->
    <path d="M176 170 Q157 160 140 147 Q133 140 137 132 Q143 126 152 134 Q166 147 178 163 Z"/>
    <circle cx="136" cy="132" r="12"/>
    <!-- Right arm & hand -->
    <path d="M224 170 Q243 160 260 147 Q267 140 263 132 Q257 126 248 134 Q234 147 222 163 Z"/>
    <circle cx="264" cy="132" r="12"/>
    <!-- Left leg & shoe -->
    <path d="M184 268 Q177 295 174 312 Q171 323 181 326 Q193 329 195 314 Q196 298 191 280 Z"/>
    <path d="M171 322 Q157 332 163 342 Q172 349 182 339 Q185 332 178 326 Z"/>
    <!-- Right leg & shoe -->
    <path d="M216 268 Q223 295 226 312 Q229 323 219 326 Q207 329 205 314 Q204 298 209 280 Z"/>
    <path d="M229 322 Q243 332 237 342 Q228 349 218 339 Q215 332 222 326 Z"/>
  </g>

  <!-- Wordmark – neon teal with glow -->
  <text x="200" y="450"
    text-anchor="middle"
    font-family="'Century Gothic','Futura','Trebuchet MS',sans-serif"
    font-weight="300"
    font-size="44"
    letter-spacing="7"
    fill="#2DD4BF"
    filter="url(#v9glow)">GEO JOKERS</text>
</svg>
