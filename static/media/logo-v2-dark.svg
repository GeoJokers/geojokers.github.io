<?xml version="1.0" encoding="UTF-8"?>
<!-- GeoJokers Logo – Variant 2: Dark Mode with Colorful Gradient Jester -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" width="400" height="520">
  <defs>
    <linearGradient id="v2jester" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%"   stop-color="#F97316"/>
      <stop offset="40%"  stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#6366F1"/>
