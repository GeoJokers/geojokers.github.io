<?xml version="1.0" encoding="UTF-8"?>
<!-- GeoJokers Logo – Variant 7: Hexagonal Badge with Gradient -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" width="400" height="520">
  <defs>
    <radialGradient id="v7bg" cx="40%" cy="30%" r="70%">
      <stop offset="0%"   stop-color="#F97316"/>
      <stop offset="35%"  stop-color="#10B981"/>
      <stop offset="70%"  stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#1E3A5F"/>
