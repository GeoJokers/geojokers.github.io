  <!-- Wordmark -->
  <text x="200" y="455"
    text-anchor="middle"
    font-family="'Century Gothic','Futura','Trebuchet MS',sans-serif"
    font-weight="300"
    font-size="44"
    letter-spacing="7"
    fill="#1a1a1a">GEO JOKERS</text>
</svg>
