    <!-- Hexagon clip: flat-top hex, centered at 200,195, size 178 -->
    <clipPath id="v7hex">
      <polygon points="
        200,17
        354,107
        354,283
        200,373
        46,283
        46,107"/>
    </clipPath>
  </defs>

  <!-- Hexagonal background -->
